[project]
name = "trident-2"
version = "0.2.0"
description = "Repo for training and evaluating TRIDENT-2, a large language model for toxicology data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "cirpy>=1.0.2",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "ete3==3.1.3",
    "h5py>=3.16.0",
    "loguru>=0.7.3",
    "pandas>=3.0.2",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "rapidfuzz>=3.14.5",
    "rdkit==2025.3.2",
    "regex>=2026.4.4",
    "requests>=2.33.1",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "openpyxl==3.1.5",
    "pyyaml>=6.0.1",
    "wandb>=0.17.9",
    "statsmodels>=0.14.2",
    "scipy>=1.11.1",
    "torch==2.12.1",
    "transformers==4.39.3",
    "huggingface_hub==0.21.4",
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
