[project]
name = "preprocess-tox-data"
version = "0.1.0"
description = "Repo for preprocessing toxicity datasets from RTECS, REACH, EFSA, ECOTOX and more."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cheminformant==2.2.2",
    "cirpy>=1.0.2",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "ete3==3.1.3",
    "h5py>=3.16.0",
    "loguru>=0.7.3",
    "pandas>=3.0.2",
    "polars>=1.39.3",
    "pubchempy>=1.0.5",
    "pyarrow>=23.0.1",
    "pyqt5>=5.15.11",
    "rapidfuzz>=3.14.5",
    "rdkit==2024.3.2",
    "regex>=2026.4.4",
    "requests>=2.33.1",
    "ruff>=0.15.9",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]
